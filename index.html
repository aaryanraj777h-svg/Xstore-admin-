<style>
:root{--bg:#eef1f8;--sf:#fff;--tx:#10162f;--mu:#5d6585;--ac:#6d4cff;--lk:#5a3df0;--bd:#d9deee;--ok:#0f8a4a;--er:#d92d4a;--wa:#b7791f;--a1:#7b5cff40;--a2:#22d3ee38;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080c1c;--sf:#111833;--tx:#e9ecfb;--mu:#98a0c4;--bd:#222b52;--lk:#a595ff;--ok:#3ddc84;--er:#ff6b81;--wa:#f5b942;--a1:#7b5cff55;--a2:#22d3ee33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#080c1c;--sf:#111833;--tx:#e9ecfb;--mu:#98a0c4;--bd:#222b52;--lk:#a595ff;--ok:#3ddc84;--er:#ff6b81;--wa:#f5b942;--a1:#7b5cff55;--a2:#22d3ee33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:12}
body::after{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(38% 38% at 18% 18%,var(--a1),transparent),radial-gradient(34% 34% at 82% 28%,var(--a2),transparent),radial-gradient(40% 40% at 55% 92%,var(--a1),transparent);animation:aur 16s ease-in-out infinite alternate}
h1,h2,h3{letter-spacing:-.01em;margin:.4em 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);border-bottom:1px solid var(--bd);animation:drop .7s cubic-bezier(.2,.8,.2,1) both}
.in{max-width:980px;margin:auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;gap:8px;align-items:center;font-weight:800;font-size:21px;letter-spacing:.04em}
.brand img{border-radius:10px;animation:fl 5s ease-in-out infinite;box-shadow:0 0 14px #7b5cff88}
.brand small{font-weight:600;font-size:13px;letter-spacing:0;padding:2px 10px;border-radius:99px;background:var(--er);color:#fff}
main{max-width:980px;margin:auto;padding:20px 16px 36px}
#v>*{animation:pg .55s cubic-bezier(.2,.8,.2,1) both}
footer{text-align:center;color:var(--mu);font-size:13px;padding:16px}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--lk);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.card{display:flex;flex-direction:column;gap:3px;padding:14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
.big{font-size:30px;line-height:1.1}
small,.mu{color:var(--mu)}
.btn{position:relative;overflow:hidden;display:inline-flex;gap:6px;align-items:center;justify-content:center;padding:10px 18px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px -8px var(--ac)}
.btn:active{transform:scale(.96)}
.btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff66,transparent);transform:skewX(-20deg);transition:left .7s}
.btn:hover::after{left:130%}
.btn.alt{background:none;color:var(--lk);box-shadow:inset 0 0 0 2px var(--lk)}
.btn.bad{background:var(--er)}
.btn.ok{background:var(--ok);color:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;transition:border-color .3s,box-shadow .3s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--a1)}
textarea{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}
.f{display:grid;gap:4px;font-weight:600;font-size:14px;margin-bottom:12px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:20px;max-width:460px;margin:0 auto 20px}
.panel.wide{max-width:none;margin:16px 0}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tab{padding:8px 16px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:transform .25s,background .25s}
.tab:hover{transform:translateY(-3px)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}
.row{display:flex;gap:12px;align-items:flex-start;padding:14px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:10px;flex-wrap:wrap;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms);transition:border-color .3s,transform .3s}
.row:hover{border-color:var(--ac);transform:translateX(4px)}
.row>svg{animation:fl 4.5s ease-in-out infinite}
.row>.g{flex:1;min-width:200px}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row .acts input{width:200px}
.mini{display:flex;gap:8px;overflow-x:auto;margin:8px 0;padding-bottom:4px}
.mini img{height:110px;border-radius:8px;border:1px solid var(--bd);animation:pop .45s cubic-bezier(.3,1.5,.5,1) both;transition:transform .3s}
.mini img:hover{transform:scale(1.8);position:relative;z-index:2}
.star{color:var(--wa);font-weight:700}
.err{color:var(--er);min-height:1.3em;margin:8px 0;font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px) scale(.9);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1);z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0) scale(1)}
@keyframes aur{to{transform:translate(5%,4%) rotate(10deg) scale(1.12)}}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes pg{from{opacity:0;transform:translateY(14px)}}
@keyframes drop{from{transform:translateY(-100%);opacity:0}}
@keyframes fl{50%{transform:translateY(-5px)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
